<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Who Knows — Northwind Labs</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Login screen -->
    <div id="login-screen" class="login-screen hidden">
      <form id="login-form" class="login-card">
        <div class="login-brand">Who<span>Knows</span></div>
        <p class="login-sub">Find the right colleague for any topic at Northwind Labs.</p>
        <label>
          Username
          <input id="login-username" type="text" placeholder="firstname.lastname (e.g. anna.rossi)" autocomplete="username" />
        </label>
        <label>
          Password
          <input id="login-password" type="password" placeholder="test" autocomplete="current-password" />
        </label>
        <button type="submit" class="btn-primary">Log in</button>
        <p id="login-error" class="login-error"></p>
        <p class="login-hint">Demo login: any employee, password <code>test</code>.</p>
      </form>
    </div>

    <!-- App -->
    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="brand">Who<span>Knows</span></div>

        <form id="search-form" class="searchbar">
          <span class="search-icon">✨</span>
          <input
            id="search-input"
            type="text"
            placeholder="Ask in plain language — e.g. “I need help preparing a budget for a new partnership”"
            autocomplete="off"
          />
          <button id="search-clear" type="button" class="search-clear hidden" title="Clear search">Clear</button>
          <button type="submit" class="btn-primary search-go">Search</button>
        </form>

        <div class="user-area">
          <span id="user-name" class="user-name"></span>
          <button id="logout-btn" class="btn-ghost">Log out</button>
        </div>
      </header>

      <div id="nudge" class="nudge hidden"></div>

      <main class="layout">
        <!-- Search results panel -->
        <aside id="results-panel" class="results-panel hidden">
          <div class="results-header">
            <div>
              <div class="results-title">Best matches</div>
              <div id="results-query" class="results-query"></div>
            </div>
            <button id="results-close" class="btn-ghost">Back to chart</button>
          </div>
          <div id="results-list" class="results-list"></div>
        </aside>

        <!-- Org chart -->
        <section class="chart-area">
          <div class="chart-controls">
            <button id="zoom-in" title="Zoom in">+</button>
            <button id="zoom-out" title="Zoom out">−</button>
            <button id="zoom-fit" title="Fit to screen">Fit</button>
          </div>
          <div id="legend" class="legend"></div>
          <div id="viewport" class="viewport">
            <div id="canvas" class="canvas">
              <svg id="edges" class="edges"></svg>
              <div id="nodes" class="nodes"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Profile modal -->
    <div id="profile-modal" class="modal hidden">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card" id="profile-content"></div>
    </div>

    <script src="js/engine.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/orgchart.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
